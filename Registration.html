<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/CSS/bootstrap.css" type="text/css">
    <link rel="stylesheet" href="assets/CSS/Registration.css" type="text/css">
    <script src="assets/JS/jquery.js"></script>
    <title>Document</title>
</head>

<body>

    <div class="container registration_bg">
        <div class="col row registration_area">
            <div class="col image_area">
                <div class="col text_area">
                    <h2>Create Your Account</h2>
                    <p>Create your account and start planning your perfect stay.</p>
                </div>
            </div>

            <!--[form_section]....................................-->

            <div class="col row input_area" style="flex-direction: column;">

                <div class="col" style="padding: 0px;"><h2>Sign Up</h2></div>

                <div class="col" style="padding: 0px;"><input class="profile_uploader" type="file" name="profile_uploader" id="profile_uploader"></div>

                <div class="col row in_1">
                    <div class="col" style="padding: 0px;"><input class="in" type="text" name="full_name" id="fullname_id" placeholder="Full Name"></div>
                    <div class="col" style="padding: 0px;"><input class="in" type="number" name="phone_number" id="phoneid" placeholder="Phone Number">
                    </div>
                </div>

                <div class="col" style="padding: 0px;">
                    <textarea name="address" id="addressid" placeholder="Address"></textarea>
                </div>

                <div class="col row in_2">

                    <div class="col row in_3">
                        <div class="col" style="padding: 0px;"><input class="in" type="date" name="dob" dob_id placeholder="Date of Birth"></div>
                        <div class="col" style="padding: 0px;"><input class="in" type="number" name="age" id="ageid" placeholder="Age"></div>
                    </div>

                    <div class="col" style="padding: 0px;">
                        <select name="gender" id="genderid">
                            <option value="0">Select Gender</option>
                            <option value="1">Female</option>
                            <option value="2">Male</option>
                            <option value="3">Other</option>
                        </select>
                    </div>

                </div>


                <div class="col row in_4">
                    <div class="col" style="padding: 0px;">
                        <input class="in" type="email" name="email" id="emailid" placeholder="Email">
                    </div>
                    <div class="col" style="padding: 0px;"><input class="in" type="text" mame="username" id="userid" placeholder="User Name"></div>
                </div>

                <div class="col row in_5">
                    <div class="col" style="padding: 0px;"><input class="in" type="password" name="password" id="passwordid" placeholder="Password"></div>
                    <div class="col" style="padding: 0px;"><input class="in" type="password" name="confirmpassword" id="confirmpass" placeholder="Confirm Password"></div>
                </div>

                <div class="col" style="padding: 0px;"><button>CREATE ACCOUNT</button></div>
                <div class="col tet" style="text-align: center;"><p>Already have an account?<a href="login.html">  Login.</a></p></div>

            </div>

            <!--[form_section]....................................-->

        </div>
    </div>

</body>

</html>
