<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/CSS/bootstrap.css" type="text/css">
    <link rel="stylesheet" href="assets/CSS/Registration.css" type="text/css">
    <script src="assets/JS/jquery.js"></script>
    <title>Document</title>
</head>

<body>

    <div class="container registration_bg">
        <div class="col row registration_area">
            <div class="col image_area">
                <div class="col text_area">
                    <h2></h2>
                    <p></p>
                </div>
            </div>

            <!--[form_section]....................................-->

            <div class="col row input_area" style="flex-direction: column;">

                <div class="col"><input type="file" name="profile_uploader" id="profile_uploader"></div>

                <div class="col row">
                    <div class="col"><input type="text" name="full_name" id="fullname_id" placeholder="Full Name"></div>
                    <div class="col"><input type="number" name="phone_number" id="phoneid" placeholder="Phone Number">
                    </div>
                </div>

                <div class="col">
                    <textarea name="address" id="addressid" placeholder="Address"></textarea>
                </div>

                <div class="col row">

                    <div class="col row">
                        <div class="col"><input type="date" name="dob" dob_id placeholder="Date of Birth"></div>
                        <div class="col"><input type="number" name="age" id="ageid" placeholder="Age"></div>
                    </div>

                    <div class="col">
                        <select name="gender" id="genderid">
                            <option value="0">gender</option>
                            <option value="1">Female</option>
                            <option value="2">male</option>
                            <option value="3">Non-binary</option>
                        </select>
                    </div>

                </div>


            </div>

            <!--[form_section]....................................-->

        </div>
    </div>

</body>

</html>
